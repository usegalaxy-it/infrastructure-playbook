---
# Grafana su VM dedicata (AlmaLinux/Rocky 9), con PostgreSQL locale
# e nginx davanti. Uguale per dev e prod: cambia solo l'inventory.
#
#   dev:  nginx_ssl_role: internal_tls        (raggiunto dal proxy della control)
#   prod: nginx_ssl_role: usegalaxy-eu.certbot (nome pubblico)
#
# Segreti in {{ monitoring_secrets_file }}:
#   influxdb.{url,grafana.username,grafana.password}
#   grafana_secrets.{admin_user,admin_password,secret_key,db_password}
#
# Telegraf su questa VM si installa con telegraf.yml.

- name: Grafana
  hosts: grafana
  become: true
  vars:
    hostname: "{{ inventory_hostname }}"
  vars_files:
    - "secret_group_vars/all.yml"
    - "{{ monitoring_secrets_file }}"

  pre_tasks:
    - name: Enable EPEL
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Ensure dnf-plugins-core is installed
      ansible.builtin.package:
        name: dnf-plugins-core
        state: present

    - name: Enable CRB (CodeReady Builder)
      ansible.builtin.command: dnf config-manager --set-enabled crb
      changed_when: false
      when: ansible_facts["distribution"] in ["Rocky", "AlmaLinux"]

    - name: Install dependencies
      ansible.builtin.package:
        name:
          - acl                  # become_user postgres
          - python3-psycopg2     # moduli community.postgresql
          - initscripts-service  # comando 'service' (handler auditd)
        state: present

    - name: SELinux | let nginx proxy to Grafana on 127.0.0.1:3000
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true
      when: ansible_facts.selinux.status | default('disabled') == 'enabled'

  roles:
    - geerlingguy.repo-epel

    - role: usegalaxy_eu.handy.os_setup
      vars:
        enable_hostname: true

    - usegalaxy-eu.autoupdates
    - influxdata.chrony

    ## Database di Grafana (solo locale)
    - galaxyproject.postgresql

    - role: galaxyproject.postgresql_objects
      become_user: postgres

    ## Reverse proxy + certificato (internal_tls in dev, certbot in prod)
    - galaxyproject.nginx

    ## Grafana
    - grafana.grafana.grafana

    ## Hardening (come influxdb.yml): ultimo, dopo che tutto è installato
    - devsec.hardening.os_hardening
    - devsec.hardening.ssh_hardening
