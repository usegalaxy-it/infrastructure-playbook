---
# defaults file for usegalaxy_it.system_policy

# ACL
usegalaxy_it_system_policy_acl: false
fix_acl_enable_rabbitmq: false
fix_acl_key_path: /etc/ssl/user/privkey-rabbitmq.pem
fix_acl_uid: "999"

# SELINUX
usegalaxy_it_system_policy_selinux: true

# Permissions fixes
usegalaxy_it_system_permissions: true
site_packages_path: "/opt/galaxy/venv/lib64/python3.13/site-packages"
packages_path:
  - "{{ site_packages_path }}/tornado"
  - "{{ site_packages_path }}/tornado-6.5.5.dist-info"

# NGINX
# Enforce ownership of nginx state/temp directories for the nginx worker user
usegalaxy_it_system_policy_nginx: true
# Must match the "user" directive in nginx.conf (workers run as galaxy
# to reach the gunicorn unix socket)
usegalaxy_it_system_policy_nginx_user: galaxy
