- name: Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ data_dir }}/keycloak"
  become: true

- name: Start keycloak stack
  community.docker.docker_compose_v2:
    project_src: "{{ data_dir }}/keycloak"
    state: present
    pull: never
    recreate: auto   # ricrea solo se la config è cambiata
  become: true
