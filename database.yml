---
- name: Postgresql DB
  hosts: database_prod # <- Inventory entry
  become: true
  become_user: root
  vars_files:
    - secret_group_vars/os.yml
    - secret_group_vars/db-main.yml # <- Inventory entry
    - group_vars/database.yml
  pre_tasks:
    - name: install acl and psycopg2 packages
      dnf:
        name: '{{ postgresql_dependencies }}'
        state: present
      become: true

    # Firewalld
    - name: Open ports for exec nodes on HTCondor CM
      ansible.posix.firewalld:
        port: 5432/tcp
        zone: public
        permanent: true
        immediate: true
        state: enabled

  roles:
    - galaxyproject.postgresql

    - role: galaxyproject.postgresql_objects
      become: true
      become_user: postgres

    - role: usegalaxy-it.postgres_replication
      become: true
      vars: 
        replication_role: master
      when: postgres_replication

    - role: usegalaxy-it.postgres_backup
      become: true
      vars: 
        backup_role: database
      when: postgres_backup

  post_tasks:
    - name: Install PostgreSQL contrib package for pgcrypto
      ansible.builtin.dnf:
        name: "postgresql{{ __postgresql_version_dotless }}-contrib"
    - name: Install pgcrypto on Galaxy database
      community.postgresql.postgresql_ext:
        name: pgcrypto
        login_db: "galaxy"
      become: true
      become_user: postgres
