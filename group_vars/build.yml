# Plugins removed from the controller (advisories without a fix)
jenkins_plugins_absent:
  - jobConfigHistory

# Certbot
# group_vars/all.yml uses the short hostname, which Let's Encrypt rejects; use the FQDN served by the vhost,
# which also matches the existing /etc/letsencrypt/renewal/<fqdn>.conf
certbot_domains: "{{ server_names }}"
certbot_auth_method: --webroot
certbot_well_known_root: /srv/nginx/_well-known_root
# No per-user key copy: there is no "nginx" user on Ubuntu, and the nginx master (root) reads the key directly
certbot_share_key_users: []

certbot_post_renewal: |
    systemctl restart nginx || true

# NGINX
nginx_enable_default_server: false
nginx_ssl_port: 443
# Port 80: ACME webroot for certbot and redirect to HTTPS
nginx_servers:
  - redirect-ssl
nginx_ssl_servers:
  - build
nginx_conf_http:
  client_max_body_size: 1g
nginx_remove_default_vhost: true

# Nginx Letsencrypt bindings
nginx_ssl_role: usegalaxy-eu.certbot
nginx_conf_ssl_certificate: /etc/ssl/certs/fullchain.pem
nginx_conf_ssl_certificate_key: /etc/ssl/private/privkey.pem
