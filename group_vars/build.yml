# Jenkins
jenkins_home: /var/lib/jenkins
jenkins_http_port: 4000
jenkins_url_prefix: /jenkins
jenkins_prefer_lts: true
# geerlingguy.jenkins 5.3.0 installs the 2023 key, which no longer verifies the repository (rotated with 2.541.1)
jenkins_repo_key_url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
# Upgrade Jenkins to the latest LTS on every run
jenkins_package_state: latest
java_packages:
  - openjdk-21-jdk
jenkins_admin_token: "{{ jenkins_admin_token_secret }}"

# runSetupWizard=false is default.
# The DirectoryBrowserSupport.CSP override (embedding Galaxy in workflow test pages) was dropped:
# Jenkins now serves user content with its default Content-Security-Policy.
# -XX:-UseBASE64Intrinsics: Java4Shell (CVE-2026-114938) mitigation, independent of the JDK build and the host CPU.
jenkins_java_options: "-XX:-UseBASE64Intrinsics -Dhudson.model.ParametersAction.keepUndefinedParameters=true -Djenkins.install.runSetupWizard=false"

# Plugins installed on the controller (as found on the VM).
# Only ensure they are present: jenkins_plugin with state "latest" downloads the newest release regardless of
# the core version and without new dependencies. build.yml then runs files/jenkins/align_plugins.py, which
# moves plugins to the newest release compatible with the installed core and adds missing dependencies.
jenkins_plugins_state: present
jenkins_plugins:
  - ansicolor
  - apache-httpcomponents-client-4-api
  - asm-api
  - bootstrap5-api
  - bouncycastle-api
  - branch-api
  - build-timeout
