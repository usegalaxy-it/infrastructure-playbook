---
# Grafana (dev). Il playbook è grafana.yml, uguale per dev e prod.
# Rispetto all'altro ambiente cambia solo il blocco "solo dev" in fondo.

# ---------- PostgreSQL locale ----------
postgresql_version: 18
postgresql_objects_users:
  - name: grafana
    password: "{{ grafana_secrets.db_password }}"
postgresql_objects_databases:
  - name: grafana
    owner: grafana
# Ascolta solo in locale (default del ruolo): Grafana si collega a 127.0.0.1
# e le righe locali di pg_hba le aggiunge già il ruolo.
postgresql_pg_hba_conf: []

# ---------- nginx ----------
nginx_enable_default_server: false
nginx_remove_default_vhost: true
nginx_servers:
  - redirect-ssl
nginx_ssl_servers:
  - grafana-ssl
nginx_conf_ssl_certificate: /etc/ssl/certs/fullchain.pem
nginx_conf_ssl_certificate_key: /etc/ssl/user/privkey-nginx.pem
nginx_conf_http:
  gzip: "on"
  gzip_vary: "on"
  gzip_min_length: 256
  gzip_proxied: any
  gzip_comp_level: 6
  gzip_http_version: "1.1"
  gzip_types: text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml image/png image/jpg
  client_max_body_size: 1g

# ---------- Grafana (ruolo grafana.grafana >= 6: tutto in grafana_ini) ----------
grafana_version: "13.3.2" ### versione fissata 26/11/26

grafana_ini:
  server:
    http_addr: 127.0.0.1    # raggiungibile solo da nginx
    http_port: 3000
    protocol: http
    domain: "{{ grafana_public_name }}"
    root_url: "{{ grafana_root_url }}"
  security:
    admin_user: "{{ grafana_secrets.admin_user }}"
    admin_password: "{{ grafana_secrets.admin_password }}"
    secret_key: "{{ grafana_secrets.secret_key }}"
    allow_embedding: true
    cookie_secure: true
  database:
    type: postgres
    host: 127.0.0.1:5432
    name: grafana
    user: grafana
    password: "{{ grafana_secrets.db_password }}"
  users:
    allow_sign_up: false
    default_theme: light
  auth.anonymous:
    enabled: "{{ grafana_anonymous_enabled }}"
    org_name: "UseGalaxy.it"
    org_role: Viewer
  panels:
    disable_sanitize_html: true
  unified_alerting:
    enabled: true
    execute_alerts: true

grafana_plugins: []
#  - grafana-worldmap-panel
#  - grafana-piechart-panel
#  - natel-discrete-panel

# Dashboard come codice: i .json in questa cartella del repo vengono provisionati
grafana_dashboards_dir: "{{ playbook_dir }}/files/grafana/dashboards"

# Datasource (provisioning). Gli uid sono quelli storici: le dashboard li cercano per uid.
# La CA interna è nel trust store della VM (prepare_node), quindi niente tlsCACert.
_influx_url: "https://{{ influxdb.url }}:8086"
grafana_datasources:
  - name: Galaxy
    uid: P9B81C0353945995B
    type: influxdb
    access: proxy
    url: "{{ _influx_url }}"
    user: "{{ influxdb.grafana.username }}"
    isDefault: true
    editable: false
    jsonData: {dbName: galaxy, httpMode: GET}
    secureJsonData: {password: "{{ influxdb.grafana.password }}"}
  - name: Galaxy Historical
    uid: PEBD82B4560F292BD
    type: influxdb
    access: proxy
    url: "{{ _influx_url }}"
    user: "{{ influxdb.grafana.username }}"
    editable: false
    jsonData: {dbName: galaxy_stats, httpMode: GET}
    secureJsonData: {password: "{{ influxdb.grafana.password }}"}
  - name: GRT Tool Usage
    uid: PA4245ACF5D5D4D2B
    type: influxdb
    access: proxy
    url: "{{ _influx_url }}"
    user: "{{ influxdb.grafana.username }}"
    editable: false
    jsonData: {dbName: grt, httpMode: GET}
    secureJsonData: {password: "{{ influxdb.grafana.password }}"}
  - name: InfluxDB - internal
    uid: P97EDD1499B7D2981
    type: influxdb
    access: proxy
    url: "{{ _influx_url }}"
    user: "{{ influxdb.grafana.username }}"
    editable: false
    jsonData: {dbName: _internal, httpMode: GET}
    secureJsonData: {password: "{{ influxdb.grafana.password }}"}
  - name: Notifications
    uid: P788011833A5A0F22
    type: influxdb
    access: proxy
    url: "{{ _influx_url }}"
    user: "{{ influxdb.grafana.username }}"
    editable: false
    jsonData: {dbName: notifications, httpMode: GET}
    secureJsonData: {password: "{{ influxdb.grafana.password }}"}

# ---------- solo dev ----------
# Raggiunto da fuori tramite il proxy della control: https://<nome-sslip>:3443/
grafana_public_name: "{{ galaxy_public_hostname }}"
grafana_root_url: "https://{{ galaxy_public_hostname }}:3443/"
grafana_anonymous_enabled: false

# Certificato firmato dalla CA interna (il browser avvisa finché non importi ca.crt)
nginx_ssl_role: internal_tls
internal_tls_sans:
  - "DNS:{{ inventory_hostname }}"
  - "DNS:{{ galaxy_public_hostname }}"
  - "IP:{{ ansible_host }}"
internal_tls_key_users:
  - nginx
# Il ruolo usa queste variabili direttamente nei 'when' con default stringa vuota,
# e ansible-core >= 2.19 rifiuta i conditional non booleani. Non usiamo RHSM.
grafana_rhsm_subscription: false
grafana_rhsm_repo: false
