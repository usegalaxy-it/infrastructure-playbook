### LEGACY PART - DO NOT REMOVE

# Autofs volumes
autofs_service.install: True
autofs_service.enable: True
nfs_kernel_tuning: True
autofs_mount_points:
  - data
  - usrlocal
autofs_conf_files:
  data:
    - share       -rw,hard,nosuid,nfs,nfsvers=4,minorversion=2         {{ groups['nfs'][0] }}:/data/share
  usrlocal:
    - /opt/galaxy        -rw,hard,nosuid,nfs,nfsvers=4,minorversion=2         {{ groups['nfs'][0] }}:/opt/galaxy

cineca:
  cineca00:
    name: cineca00
    path: /opt/galaxy
    export: "{{ groups['nfs'][0] }}:/opt/galaxy/&"
    docker_perm: rw
    nfs_options:
      - hard
      - rw
      - nosuid
  cineca01:
    name: cineca01
    path: /data/share
    export: "{{ groups['nfs'][0] }}:/data/share/&"
    docker_perm: rw
    nfs_options:
      - hard
      - rw
      - nosuid

galaxy_data_path: "{{ cineca.cineca01.path }}"
