<h3>Il Responsabile della protezione dei dati</h3>\
<p>Il Responsabile protezione dati per il CNR è l’ing. Roberto Puccinelli, nominato con provvedimento del direttore generale n. 91/2023 raggiungibile ai seguenti contatti:<br>\
email: rpd@cnr.it oppure dpo@cnr.it; PEC: rpd@pec.cnr.it</p>\
<h3>Il trattamento dei dati personali per l’uso del servizio</h3>\
<p>ELIXIR-IT rende disponibile una infrastruttura e una serie di servizi per scopi di ricerca scientifica o per gli scopi inclusi all’interno dell’accordo per la costituzione della JRU o per gli scopi definiti dagli altri partecipanti alla stessa.</p>\
<p>L’utilizzo del servizio è aperto ai membri della JRU e ai loro dipendenti, o a coloro che hanno accesso in virtù di un progetto, contratto o convenzione con l’Ente che eroga il servizio che è esposto all’interno dell’Service Delivery Plan di ELIXIR-IT, previa lettura, comprensione ed esplicita accettazione dei termini e condizioni indicati in questo documento.</p>\
<p>I servizi a cui si applica l’informativa sono tutti quelli descritti nell’Allegato tecnico del presente Contratto.</p>\
<p>Per trattamento si intendono tutte le operazioni o complesso di operazioni riguardanti la raccolta, la registrazione, organizzazione, conservazione, consultazione, elaborazione, modifica, selezione, estrazione, raffronto, utilizzo, interconnessione, blocco, comunicazione, cancellazione e distribuzione dei dati relativi agli utilizzatori dei servizi.</p>\
<p>DSB-CNR raccoglie informazioni per migliorare o sviluppare i servizi e per generare approfondimenti tecnici e per garantire supporto.</p>\
<p>I dati trattati al fine dell’uso dei servizi descritti sono dei tipi sotto specificati.</p>\
<h3>Tipi di dati trattati</h3>\
<h4>Dati comunicati dall’utente</h4>\
<p>Sono tutti quei dati personali forniti dall’utente durante la navigazione nel sito, ad esempio registrandosi, accedendo ad un’area riservata o a un servizio.</p>\
<p>I trattamenti posti in essere per queste finalità sono effettuati con lo specifico consenso fornito dall’utente e i dati vengono conservati per la sola durata dell’attività richiesta. Specifiche informative possono essere pubblicate per l’erogazione di determinate attività.</p>\
<p>L’invio facoltativo, esplicito e volontario di posta elettronica agli indirizzi indicati su questo sito comporta la successiva acquisizione dell’indirizzo del mittente, necessario per rispondere alle richieste, nonché degli eventuali altri dati personali inseriti nella missiva.</p>\
<p>È escluso il trattamento di dati sensibili o giudiziari che, se eventualmente forniti dall’utente, saranno cancellati.</p>\
<h4>Dati di Accounting</h4>\
<p>Per accedere ai servizi ICT stanziati da ELIXIR-IT tramite DSB-CNR è necessario procedere alla registrazione dei dati utente mediante un servizio di autenticazione Life Science AAI (<a href="https://lifescience-ri.eu/ls-login/policy-on-the-processing-of-personal-data-of-the-ls-aai-service.html">https://lifescience-ri.eu/ls-login/policy-on-the-processing-of-personal-data-of-the-ls-aai-service.html</a>) ovvero attraverso un identity provider riconosciuto dal CNR secondo quanto definito nell’accordo/convenzione/contratto.</p>\
<h4>Dati di monitoring</h4>\
<p>Nell’ambito delle attività di servizio svolte il personale del ente che eroga il servizio incaricato di effettuare monitoraggio e gestione degli interventi di user support, o effettuare le periodiche scansioni di sicurezza, potranno essere oggetto di trattamento i dati relativi ai log di accesso ai servizi (compresi i dati di accesso ssh).</p>\
<h3>Comunicazione e diffusione</h3>\
<p>I dati possono essere comunicati dal Titolare nello svolgimento delle proprie attività e per erogare i propri servizi, a:</p>\
<ul>\
<li>Pubbliche Amministrazioni;</li>\
<li>Fornitori di servizi tecnici, hosting provider e cloud service provider;</li>\
<li>Autorità Giudiziaria.</li>\
</ul>\
<p>I dati raccolti non saranno oggetto di diffusione o comunicazione a terzi, se non nei casi previsti dalla informativa e dalla legge e, comunque, con le modalità da queste consentite. I dati potranno venire a conoscenza del personale del ente che eroga il servizio, nell’ambito delle rispettive funzioni e in conformità alle istruzioni ricevute, soltanto per il conseguimento delle finalità indicate in questa informativa.</p>\
<p>I destinatari sono nominati, se necessario, Responsabili del trattamento da parte del Titolare, cui può essere richiesto l’elenco aggiornato dei Responsabili. Questi ultimi, in base al contratto stipulato, sono tenuti a utilizzare i dati personali esclusivamente per le finalità indicate dal Titolare, a non conservarli oltre la durata indicata né a trasmetterli a terzi senza la sua esplicita autorizzazione.</p>\
<p>I dati personali forniti dagli utenti che inoltrano richieste di informazioni e suggerimenti sono utilizzati al solo fine di eseguire il servizio o la prestazione richiesta e sono eventualmente comunicati ad altre aree all’interno dell’Istituto o ad altri soggetti pubblici o privati nel solo caso in cui ciò sia necessario per completare la richiesta. I dati non sono trasferiti a paesi extra UE.</p>\
<h3>Modalità di trattamento</h3>\
<p>Il trattamento dei dati personali viene effettuato prevalentemente utilizzando procedure e supporti elettronici e in modo lecito, corretto, pertinente, limitato a quanto necessario al raggiungimento delle finalità del trattamento, per il solo tempo necessario a conseguire gli scopi per cui sono stati raccolti e comunque in conformità ai principi indicati nell’art. 5 del Regolamento UE 2019/679 GDPR.</p>\
<p>Specifiche misure di sicurezza sono osservate per prevenire la perdita dei dati, usi illeciti o non corretti e accessi non autorizzati.</p>\
<h3>Luogo di trattamento dei dati</h3>\
<p>I trattamenti di dati personali connessi ai servizi ELIXIR-IT erogati da DSB-CNR hanno luogo presso le strutture dell’Ente stesso e sono curati solo da personale tecnico dell’ufficio incaricato del trattamento, oppure dai responsabili designati dal titolare che operano all’interno dell’Unione europea. I Dati Personali dell’Utente possono essere trasferiti in un Paese diverso da quello in cui si trova l’Utente. L’Utente può verificare se uno dei trasferimenti sopra descritti ha luogo esaminando la sezione di questo documento relativa ai dettagli sul trattamento dei Dati Personali o richiedere informazioni al Titolare contattandolo ai recapiti di apertura.</p>\
<h3>Durata del trattamento</h3>\
<p>L’ente che eroga il servizio tratta i dati personali raccolti per il tempo necessario a consentire l’uso del servizio richiesto e comunque non oltre 12 mesi dal cessato utilizzo dello stesso.</p>\
<h3>Diritti dell’interessato</h3>\
<p>Gli interessati hanno il diritto di chiedere al titolare del trattamento l’accesso ai dati personali e la rettifica o la cancellazione degli stessi o la limitazione del trattamento che li riguarda o di opporsi al trattamento secondo quanto previsto dagli artt. 15 e seguenti del Regolamento. L’apposita istanza deve essere presentata contattando il Responsabile della protezione dei dati all’indirizzo sopra indicato.</p>\
<p>Gli interessati hanno anche il diritto di proporre reclamo al Garante (<a href="https://garanteprivacy.it">https://garanteprivacy.it</a>) quale autorità di controllo o di adire le opportune sedi giudiziarie (artt. 77 e 79 del Regolamento).</p>\
<h3>Aggiornamento</h3>\
<p>Questa informativa è soggetta ad aggiornamenti in ottemperanza alla normativa nazionale e comunitaria in materia, si invita quindi a consultarla periodicamente. Nel caso di mancata accettazione delle modifiche apportate a questa informativa, l’utente può richiedere al Titolare la cancellazione dei propri dati personali.</p>\
<p>Salvo quanto diversamente specificato, la privacy policy pubblicata sul sito continua ad applicarsi al trattamento dei dati personali raccolti sino al momento della sua sostituzione.</p>
