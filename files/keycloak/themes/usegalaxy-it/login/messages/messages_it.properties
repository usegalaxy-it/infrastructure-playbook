aupText=\
<p><strong>ELIXIR Acceptable User Policy - Condizioni per l’utilizzo dei servizi IaaS, PaaS, SaaS e HPC forniti da ELIXIR-IT (AUP)</strong></p>\
<h3>Premessa</h3>\
<p>Il nodo italiano dell’Infrastruttura di Ricerca Europea ELIXIR, è stato formalmente costituito nella forma di una Joint Research Unit (JRU) denominata Infrastruttura Italiana di Bioinformatica (ELIXIR-IIB oppure ELIXIR-IT). ELIXIR-IT è coordinata dal Consiglio Nazionale delle Ricerche (CNR) e attualmente comprende 30 partner tra cui diverse università, istituti di ricerca e fornitori pubblici di Cloud e High Performance Computing (HPC) (per ulteriori informazioni sulla composizione della partnership, consultare il sito web di ELIXIR-IT <a href="https://elixir-italy.org/">https://elixir-italy.org/</a>) (nel seguito “ELIXIR-IT”).</p>\
<p>Il Nodo italiano di ELIXIR, costituisce l’Infrastruttura di Ricerca Italiana di Bioinformatica (IIB) distribuita su più centri e si propone di supportare tutti i ricercatori italiani che operano nel campo della Bioinformatica e delle Scienze della Vita, favorendo lo scambio e lo sviluppo di competenze, di mettere a sistema le piattaforme per la produzione di dati omici e ICT con una ricca dotazione di risorse bioinformatiche già riconosciute in ambito internazionale e pubblicamente disponibili, e di contribuire alla loro integrazione in seno all’infrastruttura europea.</p>\
<p>Un altro obiettivo primario di ELIXIR-IT è quello di organizzare attività di training, sia di base che avanzato, nei diversi settori applicativi della Bioinformatica al fine di favorire la formazione di giovani bioinformatici, la cui domanda è in fortissima crescita in ambito nazionale ed internazionale.</p>\
<p>Le attività di ELIXIR sono suddivise in aree tecnologiche, denominate piattaforme. Coordinano la fornitura di servizi di alta qualità per le scienze della vita e guidano l’integrazione dei servizi nazionali all’interno dell’infrastruttura ELIXIR.</p>\
<p>ELIXIR-IT comprende sei piattaforme operative (Compute, Data, Interoperability, Tools, Omics e Training).</p>\
<p>L’utilizzo dei servizi forniti è aperto all’intera comunità scientifica nazionale e alle imprese, a seguito di specifica richiesta mediante le modalità e la policy definita da ELIXIR-IT, previa lettura, comprensione ed esplicita accettazione dei termini e condizioni indicati nel presente documento.</p>\
<p>Le seguenti Acceptable User Policy (AUP) trovano applicazione nell’ambito dei servizi all’interno della piattaforma Compute.</p>\
<p>La piattaforma Compute offre servizi di analisi bioinformatica specializzati e personalizzabili, servizi di calcolo e archiviazione. Questi includono la piattaforma Laniakea in-cloud quale sistema di gestione del flusso di lavoro on-demand per l’analisi di dati biologici, la piattaforma IaaS e PaaS per ospitare e distribuire strumenti e servizi bioinformatici.</p>\
<h3>Definizioni</h3>\
<p><strong>Ente che eroga il servizio:</strong> L’ente che, in qualità di membro di ELIXIR-IT eroga all’interno della Platform Compute, un servizio IaaS, PaaS, SaaS o HPC.</p>\
<p><strong>Responsabile del servizio:</strong> la persona fisica o che, coordinandosi con i Compute Platform Leader di ELIXIR-IT gestisce il servizio esposto all’interno della Piattaforma e/o inserito nel Service Delivery Plan di ELIXIR-IT. Il Responsabile del servizio ha la funzione di garantire l’accesso, gestire e monitorare l’andamento del servizio offerto.</p>\
<p><strong>Amministratore di sistema della Platform Compute:</strong> Chiunque, all’interno dell’Ente che eroga il servizio in ELIXIR-IT, sia incaricato all’amministrazione delle risorse per conto del Responsabile del servizio.</p>\
<p><strong>Utente Amministratore di accesso al Servizio:</strong> Un utente amministratore di sistema, che ha i privilegi necessari per la gestione di risorse cloud, aggiunta di utilizzatori e amministrazione di servizi.</p>\
<p><strong>Utente:</strong> Chiunque ottenga, a qualunque titolo, i permessi di accesso o di utilizzo dei servizi istanziati da ELIXIR-IT</p>\
<p>Gli Utenti dei servizi offerti dalla Platform Compute di ELIXIR-IT sono tenuti a rispettare i seguenti termini e condizioni:</p>\
<ol>\
<li>Il trattamento è effettuato solo esclusivamente sulla base di un accordo/progetto che permetta di indentificare lo scopo dell’attività di ricerca da svolgere;</li>\
<li>L’utente si impegna al rispetto di tutte le seguenti condizioni e di quelle specificate nel documento “Acceptable User Policy - Condizioni per l’utilizzo dei servizi IaaS, PaaS, SaaS e HPC forniti da ELIXIR-IT” che specifica le condizioni per l’utilizzo dei singoli servizi, Terms of Use, QM Policy, ELIXIR-IT Services Privacy Policy, qualora pertinenti allo specifico servizio di suo interesse. L’utente deve essere identificato, mediante Life Science AAI, ovvero altro sistema di autenticazione a due fattori indicato come equivalente.</li>\
<li>L’accesso è condizionato alla preventiva approvazione da parte del Responsabile del Servizio;</li>\
<li>L’Amministratore di accesso al Servizio potrà, a sua discrezione, dare accesso ad Utenti alle risorse a lui assegnate alle seguenti condizioni:\
<ol>\
<li>L’Amministratore di accesso al Servizio si impegna ad identificare qualunque Utente a cui darà accesso e sarà in ogni momento in grado di fornire la lista di tali Utenti ad ELIXIR-IT;</li>\
<li>L’Amministratore di accesso al Servizio si impegna a far sottoscrivere questa AUP, nonché i documenti connessi e correlati oltre agli eventuali aggiornamenti a tutti gli Utenti a cui darà accesso, nonché le norme d’uso per l’utilizzo delle risorse informatiche adottate da ELIXIR-IT. L’amministratore di accesso al servizio dovrà bloccare l’accesso agli utenti che non accettino le nuove versioni dei citati documenti. Si impegna inoltre a verificare che gli utenti abbiano completato un corso base di sicurezza informatica, eventualmente anche erogato in modalità e-learning così come erogato dall’istituzione/ente di appartenenza dello stesso utente;</li>\
<li>L’Amministratore di accesso al Servizio NON condivide l’accesso privilegiato alle risorse a lui assegnate;</li>\
</ol></li>\
<li>L’Utente NON condivide le proprie credenziali di accesso ai servizi di ELIXIR-IT.</li>\
<li>L’Utente si impegna a seguire tempestivamente le istruzioni che gli verranno eventualmente comunicate dal Responsabile del Servizio;</li>\
<li>L’Utente si impegna a comunicare ogni violazione delle presenti condizioni al Responsabile del servizio;</li>\
<li>L’amministratore di accesso al servizio acconsente che le risorse che istanzierà siano soggette a periodiche scansioni di sicurezza e si impegna a risolvere o mitigare tempestivamente ogni vulnerabilità gli verrà segnata seguendo gli eventuali suggerimenti ricevuti;</li>\
<li>L’utilizzo delle risorse è concesso solo per gli scopi previsti all’interno dell’atto costitutivo della JRU di ELIXIR-IT;</li>\
<li>L’Utente accetta il fatto che ELIXIR-IT e L’Ente che eroga il servizio sebbene offra assistenza e si impegni a garantire una pronta risoluzione delle eventuali problematiche relative all’interruzione del servizio, non possa offrire garanzia sulla continuità dello stesso;</li>\
<li>L’Utente accetta il fatto che, a meno di accordi espliciti, ELIXIR-IT e l’Ente che eroga il servizio non possa essere ritenuto responsabile del back-up dei dati;</li>\
<li>L’Utente accetta che vengano tenuti i log sull’uso dei servizi offerti dalla Platform Compute di ELIXIR-IT secondo le normative vigenti e i regolamenti del CNR e degli Enti che offrono i servizi, nonché sulla base del Regolamento per l’uso delle risorse informatiche dell’infrastruttura ICT facente parte di ELIXIR-IT;</li>\
<li>L’Utente accetta che il personale messo a disposizione dagli Enti partner della JRU, che concorre al funzionamento del centro, possa sottoporre a monitoraggio le risorse utilizzate;</li>\
<li>Gli Amministratori della Platform Compute, su delega del Responsabile del Servizio, potranno garantire supporto a fronte di una richiesta specifica da parte dell’Utente e previa configurazione da parte dello stesso di accesso alle macchine mediante chiave ssh;</li>\
<li>Qualora l’utente richieda un intervento di manutenzione sarà sua cura procedere ad effettuare un backup dei dati, poiché l’eventuale cancellazione dei dati stessi, a seguito dell’intervento di manutenzione, non potrà essere in nessun caso addebitata al personale messo a disposizione da ELIXIR-IT e dall’Ente che eroga il servizio incaricato di effettuarla.</li>\
</ol>\
<p>ELIXIR-IT si riserva di modificare questo documento in futuro. Il contenuto delle nuove versioni sostituirà in toto la presente versione ed avrà lo stesso valore del presente documento. Le nuove versioni verranno pubblicate sul sito web di ELIXIR-IT con almeno un mese di anticipo rispetto all’entrata in vigore e ne verrà spedita copia, usando la casella e-mail usata per registrarsi, a tutti gli Utenti che avranno la possibilità di non accettarla. La mancata accettazione della nuova versione implicherà il decadimento del diritto di utilizzo delle risorse. Continuare ad usare i servizi offerti dalla Platform Compute, dopo l’entrata in vigore della nuova versione, implicherà la sua accettazione.</p>\
<p>La violazione di questa AUP può determinare la sospensione o revoca dell’accesso alle risorse offerte all’Utente sul servizio erogato.</p>

