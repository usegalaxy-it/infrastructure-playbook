<p><strong>Terms of Use per l’utilizzo dei servizi IaaS, PaaS, SaaS e HPC forniti da ELIXIR-IT (ToU)</strong></p>\
<p>Il Nodo Italiano è stato formalmente costituito nella forma di Joint Research Unit (JRU), coordinata dal Consiglio Nazionale delle Ricerche (CNR), tra cui diverse università, istituti di ricerca e fornitori pubblici di Cloud e High Performance Computing (HPC).</p>\
<p>ELIXIR-IT rende disponibile, anche a soggetti terzi (di seguito Utenti) l’uso di Risorse Cloud e archiviazione dati.</p>\
<p>Nel seguito con Risorse offerte dall’infrastruttura ICT di ELIXIR-IT, all’interno dei servizi condivisi mediante la Compute Plaform di ELIXIR-IT, si intendono risorse messe a disposizione in modalità IaaS, PaaS, SaaS, HPC e archiviazione dati.</p>\
<p>L’accesso alla Piattaforma è consentito alle condizioni elencate nei documenti Acceptable User Policy, Terms of USE, QM Policy, ELIXIR-IT Services Privacy Policy.</p>\
<ol>\
<li>L’Utente dichiara di possedere tutte le conoscenze tecniche necessarie per l’utilizzo delle Risorse messe a disposizione da ELIXIR-IT, e si impegna a far rispettare a tutti coloro a cui potrà eventualmente dare accesso le prescrizioni previste da questo documento e dai documenti richiamati (Acceptable User Policy, Terms of USE, QM Policy, ELIXIR-IT Services Privacy Policy), manlevando e tenendo indenne ELIXIR-IT e l’Ente che eroga il servizio da qualsiasi eventuale richiesta o pretesa di risarcimento danni da chiunque avanzata che trovi titolo nella violazione delle richiamate prescrizioni e comunque nel comportamento dell’Utente e/o dei soggetti cui ha consentito l’uso</li>\
<li>L’autorizzazione all’accesso è rilasciata dal Responsabile del Servizio o da un suo delegato per un periodo temporale limitato alla durata del rapporto sulla base del quale è consentita l’attività con le risorse informatiche erogate.</li>\
<li>I file di log relativi all’accesso ai servizi erogati saranno conservati per un tempo di sei mesi e, eventualmente, resi disponibili all’Autorità Giudiziaria (AG);</li>\
<li>All’Utente/Amministratore di accesso al Servizio è consentito utilizzare le Risorse in conformità e nei limiti del Progetto/Accordo/Contratto per cui è stato concesso l’accesso, Pertanto è vietato:\
<ol>\
<li>Utilizzare le Risorse per scopi commerciali o a fini di lucro, trasmettere materiale commerciale o pubblicitario (spamming) o consentire l’uso delle Risorse da parte di terzi per le suddette attività.</li>\
<li>Attuare attività comunque idonee a danneggiare, distruggere, compromettere la sicurezza delle Risorse o dirette a violare la riservatezza e/o cagionare danno a terzi.</li>\
<li>Attuare attività dirette ad aggirare le prescrizioni di questo documento o di quelli dallo stesso richiamati del presente documento o ad ottenere servizi in eccesso rispetto a quelli richiesti.</li>\
<li>Utilizzare indirizzi IP diversi da quelli assegnati.</li>\
<li>Creare, trasmettere o conservare immagini, dati o altro materiale offensivo, diffamatorio, osceno, indecente o che attenti alla dignità umana, specialmente se riguardante il sesso, l’etnia, la religione, le opinioni politiche o la condizione personale o sociale.</li>\
<li>Accedere o utilizzare qualunque sistema senza autorizzazione, inclusi i tentativi di scansione e verifica delle possibili vulnerabilità.</li>\
<li>Falsificare gli header dei pacchetti TCP/IP, dei messaggi di posta elettronica o di una qualunque parte di un messaggio che descriva la sua origine o percorso.</li>\
<li>Porre in essere attività di port scanning, network scanning, denial of service (DoS) e distributed denial of service (DDoS).</li>\
<li>Ospitare servizi che diffondano traffico non autorizzato, quali open relay o TOR exit nodes.</li>\
<li>Attuare attività di Virtual Currency Mining.</li>\
<li>Attuare o operare un qualsiasi tipo di game server.</li>\
</ol></li>\
<li>L’Amministratore di accesso al Servizio si impegna, anche in nome e per conto dei soggetti cui abbia a qualsiasi titolo consentito di utilizzare le Risorse , ad utilizzarle esclusivamente per scopi leciti e conformi alla legge nazionale, dell’UE ed internazionale eventualmente applicabile, nonché ai regolamenti e consuetudini d’uso delle reti e dei servizi acceduti.</li>\
<li>L’Amministratore di accesso al Servizio dichiara di essere amministratore esclusivo delle Risorse (nei limiti in cui la definizione di amministratore sia appropriata per le Risorse ottenute) e di essere pertanto l’unico responsabile:\
<ol>\
<li>Della gestione dei dati e/o delle informazioni e/o contenuti dallo stesso trattati nella piattaforma, della loro sicurezza, del loro salvataggio e di ogni attività utile o necessaria a garantirne l’integrità, impegnandosi ad applicare idonee ed adeguate misure di sicurezza;</li>\
<li>Del contenuto di informazioni e dati accessibili e/o resi disponibili nella piattaforma e comunque a qualsiasi titolo, trasmessi o messi on line dall’Utente.</li>\
<li>Dei malfunzionamenti delle Risorse per utilizzi non conformi alle prescrizioni di cui al presente documento.</li>\
<li>Dello smarrimento o della divulgazione delle credenziali di accesso.</li>\
<li>Della gestione degli accessi alle Risorse provvedendo alla variazione delle credenziali di accesso almeno ogni 12 mesi.</li>\
</ol></li>\
<li>L’Utente/Amministratore di accesso al Servizio si impegna a segnalare con la massima tempestività usi delle Risorse non conformi a quanto previsto da questo documento o eventuali violazioni di sicurezza di cui sia venuto a conoscenza.</li>\
<li>L’Utente/Amministratore di accesso al Servizio si impegna, anche in nome e per conto dei soggetti cui abbia a qualsiasi titolo consentito di utilizzare le Risorse, a non installare software privo di regolare licenza.</li>\
<li>L’Utente/Amministratore di accesso al Servizio è l’unico ed esclusivo responsabile di ogni operazione attuata senza previo formale accordo con ELIXIR-IT, relativa alla utilizzazione, gestione ed amministrazione delle Risorse, con riferimento alle quali si impegna a:\
<ol>\
<li>Rispettare e far rispettare ai terzi la vigente normativa applicabile, ivi inclusa quella dedicata alla protezione dei dati personali di cui al Regolamento UE n. 679/2016 ed al D.Lgs n. 196/2003 e ss.mm.ii, così come modificato ed integrato dal D.Lgs. 101/2018 e ss.mm.ii;</li>\
<li>Manlevare e tenere indenne ELIXIR-IT e l’ente che eroga il servizio da ogni e qualsiasi domanda o pretesa di risarcimento danni diretta o indiretta, di qualsiasi natura o specie, da chiunque avanzata.</li>\
</ol></li>\
<li>L’Utente/Amministratore di accesso al Servizio si impegna a tenere indenne e manlevare ELIXIR-IT e l’ente che eroga il servizio da ogni e qualsivoglia domanda o pretesa di terzi per i danni agli stessi arrecati dal o mediante l’utilizzo delle Risorse , sostenendone i costi i risarcimenti, gli oneri e le spese legali che dovessero scaturire da azioni di responsabilità, impegnandosi ad informare ELIXIR-IT delle azioni intentate nei propri confronti.</li>\
<li>ELIXIR-IT e l’Ente che eroga il servizio non saranno in nessun caso ritenuti responsabili per l’uso delle Risorse in relazione a situazioni critiche che comportino, a titolo esemplificativo, rischi per l’incolumità delle persone, danni all’ambiente, ai servizi destinati alle persone o danni ad impianti.</li>\
<li>ELIXIR-IT e l’Ente che eroga il servizio non saranno in nessun caso responsabili per le informazioni, i dati, i contenuti immessi, trasmessi o comunque trattati dall’Utente/Amministratore di accesso al Servizio nell’uso delle Risorse ed in genere connessi all’uso delle Risorse stesse e si riservano di adottare qualsiasi iniziativa ed azione a tutela dei propri diritti e interessi.</li>\
<li>L’Ente a cui afferisce l’utente resta unico titolare ai sensi del Regolamento UE n. 679/2016 nonché del D.Lgs. 196/2003 così come modificato ed integrato dal D.Lgs. 101/2018 e del trattamento dei dati immessi e/o trattati nella Piattaforma.</li>\
<li>ELIXIR-IT e l’ente che eroga il Servizio si riservano il diritto di attivare sistemi automatici di intrusion detection (IDS) e intrusion prevention (IPS) atti a rilevare e prevenire eventuali violazioni delle regole di sicurezza della Piattaforma.</li>\
<li>ELIXIR-IT e l’Ente che eroga il servizio si riservano il diritto di monitorare il rispetto delle regole di questa Policy attivando, tra le altre misure, attività di monitoraggio del traffico di rete e sistemi di filtraggio sugli apparati perimetrali della rete.</li>\
<li>ELIXIR-IT e l’Ente che eroga il servizio si riservano il diritto di rimuovere o bloccare qualsiasi contenuto o risorsa che violi il contenuto del presente documento.</li>\
<li>L’utente/Amministratore è tenuto ad informare il Responsabile del Servizio e a inserire un ringraziamento e/o una citazione ad ELIXIR IT e al Servizio utilizzato qualora dall’uso del servizio offerto da ELIXIR-IT scaturisca un risultato, una pubblicazione, un poster o un abstract. Le modalità sono indicate al successivo punto 21.</li>\
<li>ELIXIR-IT e l’Ente che eroga il servizio, a loro discrezione e senza che l’esercizio di tale facoltà possa essergli contestata come inadempimento o violazione di un eventuale contratto, si riservano la facoltà di sospendere la disponibilità delle Risorse , anche senza alcun preavviso, nel caso in cui:\
<ol>\
<li>l’Utente/Amministratore di accesso al Servizio violi anche una soltanto delle disposizioni contenute nella Policy di utilizzo.</li>\
<li>Vi siano fondate ragioni per ritenere che le Risorse siano utilizzate da terzi non autorizzati.</li>\
<li>Si verifichino casi di forza maggiore o circostanze che, ad insindacabile giudizio di ELIXIR-IT e dell’Ente che eroga il servizio, impongano di eseguire interventi di emergenza o relativi alla risoluzione di problemi di sicurezza, pericolo per l’intera rete e/o per persone o cose; in tal caso, la disponibilità delle Risorse sarà ripristinata quando ELIXIR-IT abbia valutato che siano state effettivamente rimosse o eliminate le cause che avevano determinato la sua sospensione.</li>\
<li>L’Utente si trovi coinvolto, a qualsiasi titolo, in una qualsiasi controversia giudiziale o anche stragiudiziale di natura civile, penale o amministrativo nel caso in cui detta controversia abbia ad oggetto atti e comportamenti posti in essere attraverso le Risorse;</li>\
<li>La sospensione sia richiesta dall’Autorità Giudiziaria.</li>\
</ol></li>\
<li>Qualora gli utenti utilizzino le Risorse di ELIXIR-IT per l’archiviazione e il trattamento dei dati genetici umani, sarà garantito il rispetto delle disposizioni previste nell’ambito del GDPR nonché della normativa nazionale di attuazione, ivi compresi il Provvedimento del Garante che individua le prescrizioni contenute nelle Autorizzazioni generali nn. 1/2016, 3/2016, 6/2016, 8/2016 e 9/2016 in quanto compatibili con il GDPR e con il d.lgs. n. 101/2018 di adeguamento del d.lgs. 196/2003 del 13 dicembre 2018.</li>\
<li>Il trasferimento dei dati genetici riferibili all’uomo, per accedere ai servizi, è effettuato mediante il ricorso a canali di comunicazione protetti, in particolare è necessario l’uso di un canale crittografato basato sul protocollo SSH per la trasmissione dei dati. In particolare:\
<ol>\
<li>Gli utenti accedono e possono consultare i dati genetici solo mediante log in con inserimento di User Id e Password;</li>\
<li>Gli utenti che accedono alle Risorse:\
<ol>\
<li>devono garantire che l’utilizzo dei dati non violi nessun diritto di cui terze parti sono titolari;</li>\
<li>devono garantire l’anonimizzazione o la pseudonimizzazione dei dati utilizzati ai sensi di quanto disposto dal GDPR;</li>\
<li>devono garantire il trattamento disgiunto dei dati genetici e sanitari dagli altri dati personali che permettono di identificare il soggetto dei dati.</li>\
</ol></li>\
<li>L’ente/centro di appartenenza dell’Utente dovrà nominare responsabile al trattamento il partner tecnologico, qualora si utilizzi nello specifico questo servizio.</li>\
</ol></li>\
<li>Qualora dalle attività di ricerca compiute mediante l’uso dei servizi messi a disposizione dalla Platform Compute ELIXIR-IT derivi una pubblicazione/poster/abstract o qualsiasi risultato scientifico sottoposto a pubblicazione, l’utente/amministratore di accesso al servizio si impegna a citare i servizi utilizzati ed ELIXIR-IT all’interno della pubblicazione scientifica.</li>\
</ol>\
<p>ELIXIR-IT si riserva di modificare questo documento in futuro. Il contenuto di tali nuove versioni sostituirà in toto la presente versione ed avrà lo stesso valore di questo documento. Tali nuove versioni verranno pubblicate sul sito web di ELIXIR-IT (<a href="https://elixir-italy.org/">https://elixir-italy.org/</a>) con almeno un mese di anticipo rispetto all’entrata in vigore. La mancata accettazione della nuova versione implicherà il decadimento del diritto di utilizzo delle Risorse. E’ fatto salvo quanto previsto in tema di utilizzo dei servizi offerti dalla Platform Compute, dopo l’entrata in vigore della nuova versione, che implica la sua implicita accettazione.</p>

privacyText=\
<h3>Perché di questa informativa</h3>\
<p>Ai sensi del Regolamento UE 2016/679 (Regolamento nel seguito) e del Decreto Legislativo 30 giugno 2003, n. 196, così come modificato dal D.lgs. 101/2018, questa informativa descrive le modalità di trattamento dei dati personali degli utenti che accedono ai servizi di ELIXIR-IT tramite gli Enti, titolari dei servizi, che li erogano e che sono individuati all’interno dell’SDP:</p>\
<h3>ELIXIR-IT</h3>\
<p>Il nodo italiano dell’Infrastruttura Europea ELIXIR, è organizzata nella forma di una Joint Research Unit (JRU) denominata Infrastruttura Italiana di Bioinformatica (ELIXIR-IT). È coordinata dal Consiglio Nazionale delle Ricerche (CNR) e attualmente comprende diversi partner, tra cui Università, Istituti di ricerca e fornitori pubblici di servizi Cloud e High Performance Computing (HPC). (nel seguito ELIXIR-IT).</p>\
<p>Il Nodo italiano di ELIXIR ha l’ambizione di costituire una Infrastruttura Italiana di Bioinformatica (IIB) distribuita su più centri e si propone di supportare i ricercatori italiani che operano nel campo della Bioinformatica, favorendo lo scambio e lo sviluppo di competenze, di mettere a sistema le varie risorse bioinformatiche già riconosciute in ambito internazionale e pubblicamente disponibili, e di contribuire alla loro integrazione in seno all’infrastruttura europea.</p>\
<p>ELIXIR-IT fornisce anche attività di training, sia di base che avanzato, nei diversi settori applicativi della Bioinformatica al fine di favorire la formazione di giovani bioinformatici, la cui domanda è in fortissima crescita in ambito nazionale ed internazionale.</p>\
<p>Le attività di ELIXIR-IT sono suddivise in aree tecnologiche, denominate piattaforme. Coordinano la fornitura di servizi computazionali di alta qualità per le scienze della vita e guidano l’integrazione dei servizi nazionali all’interno dell’infrastruttura ELIXIR-IT. ELIXIR-IT comprende sei piattaforme operative (Compute, Data, Interoperability, Tools, Omics e Training).</p>\
<p>L’utilizzo dei servizi forniti è aperto a dipendenti e associati degli enti membri della JRU e al personale di soggetti terzi che partecipano ad attività definite in un contratto o in un accordo con l’ELIXIR-IT, anche con uno dei membri della JRU in maniera disgiunta, autorizzati dal JRU manager previa lettura, comprensione ed esplicita accettazione dei termini e condizioni indicati in questo documento.</p>\
