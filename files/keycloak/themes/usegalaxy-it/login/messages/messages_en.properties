<p><strong>Terms of Use for the Utilization of IaaS, PaaS, SaaS, and HPC Services Provided by ELIXIR-IT (ToU)</strong></p>\
<p>The Italian Node has been formally established as a Joint Research Unit (JRU), coordinated by the National Research Council (CNR), and includes several universities, research institutes, and public providers of Cloud and High Performance Computing (HPC).</p>\
<p>ELIXIR-IT makes available, also to third parties (hereinafter Users), the use of Cloud Resources and data storage.</p>\
<p>Hereinafter, "Resources offered by the ICT infrastructure of ELIXIR-IT," within the shared services through the Compute Platform of ELIXIR-IT, refers to resources provided in IaaS, PaaS, SaaS, HPC, and data storage modes.</p>\
<p>Access to the Platform is granted under the conditions listed in the Acceptable User Policy, Terms of Use, QM Policy, and ELIXIR-IT Services Privacy Policy documents.</p>\
<ol>\
<li>The User declares to possess all the necessary technical knowledge to use the Resources provided by ELIXIR-IT and commits to ensuring that all those to whom they may grant access comply with the provisions set forth in this document and the documents listed in paragraph 3, indemnifying and holding ELIXIR-IT and the Service Provider harmless from any claims or demands for damages from anyone that may arise due to the violation of the aforementioned provisions and, in any case, due to the behavior of the User and/or the individuals to whom they have allowed access to the resources.</li>\
<li>Authorization for access is granted by the Service Manager or their delegate for a limited period corresponding to the duration of the relationship under which the use of the provided IT resources is permitted.</li>\
<li>The log files related to access to the services provided will be stored for a period of six months and made available to the Judicial Authority (AJ).</li>\
<li>The User/System Administrator is permitted to use the Resources in accordance with and within the limits of the Project/Agreement/Contract for which access has been granted. Therefore, it is prohibited:\
<ol>\
<li>To use the Resources for commercial purposes or for profit, transmit commercial or advertising material (spamming), or allow third parties to use the Resources for these activities.</li>\
<li>To engage in activities that could damage, destroy, or compromise the security of the Resources or that are aimed at violating confidentiality and/or causing harm to third parties.</li>\
<li>To engage in activities aimed at circumventing the provisions of this document or those in paragraph 3 of this document or to obtain services in excess of those contracted.</li>\
<li>To use IP addresses other than those assigned.</li>\
<li>To create, transmit, or store images, data, or any other material that is offensive, defamatory, obscene, indecent, or that violates human dignity, especially if related to sex, ethnicity, religion, political opinions, or personal or social condition.</li>\
<li>To access or use any system without authorization, including attempts to scan and check for possible vulnerabilities.</li>\
<li>To forge TCP/IP packet headers, email messages, or any part of a message describing its origin or path.</li>\
<li>To engage in port scanning, network scanning, denial of service (DoS), and distributed denial of service (DDoS) activities.</li>\
<li>To host services that spread unauthorized traffic, such as open relays or TOR exit nodes.</li>\
<li>To engage in Virtual Currency Mining activities.</li>\
<li>To operate or run any type of game server.</li>\
</ol></li>\
<li>The Service Access Administrator undertakes, also on behalf of those to whom they have allowed access to the Resources, to use them exclusively for lawful purposes and in accordance with national, EU, and international law, as well as the regulations and customary usage of the networks and services accessed.</li>\
<li>The Service Access Administrator declares to be the exclusive administrator of the Resources (to the extent that the definition of administrator is applicable to the obtained Resources) and therefore the sole responsible party for:\
<ol>\
<li>The management of data and/or information and/or content processed on the platform, its security, backup, and any activities necessary to ensure its integrity, undertaking to apply appropriate and adequate security measures.</li>\
<li>The content of information and data accessible and/or made available on the platform and, in any case, transmitted or made available online by the User.</li>\
<li>Any malfunctions of the Resources due to uses that do not comply with the provisions of this document.</li>\
<li>The loss or disclosure of access credentials.</li>\
<li>The management of access to the Resources, ensuring that the access credentials are changed at least every 12 months.</li>\
</ol></li>\
<li>The User/Service Access Administrator agrees to promptly report any non-compliant use of the Resources as specified in this document or any security violations they become aware of.</li>\
<li>The User/Service Access Administrator agrees, also on behalf of those to whom they have allowed access to the Resources, not to install software without a valid license.</li>\
<li>The User/Service Access Administrator is the sole and exclusive responsible party for any operation carried out without prior formal agreement with ELIXIR-IT, concerning the use, management, and administration of the Resources. In this regard, they undertake to:\
<ol>\
<li>Comply with and ensure third parties comply with applicable laws, including the regulations regarding the protection of personal data as per EU Regulation No. 679/2016 and Legislative Decree No. 196/2003 and its amendments, as well as Legislative Decree No. 101/2018 and its amendments.</li>\
<li>Indemnify and hold ELIXIR-IT and the service provider harmless from any claims or damages, direct or indirect, of any kind or nature, made by any party.</li>\
</ol></li>\
<li>The User/Service Access Administrator agrees to indemnify and hold ELIXIR-IT and the service provider harmless from any claims or damages caused to third parties through the use of the Resources, covering the costs, damages, and legal expenses arising from liability actions, and undertakes to inform ELIXIR-IT of any legal actions initiated against them.</li>\
<li>ELIXIR-IT and the service provider will not be held responsible under any circumstances for the use of the Resources in critical situations, including, but not limited to, risks to personal safety, environmental damage, harm to services for individuals, or damage to facilities.</li>\
<li>ELIXIR-IT and the service provider will not be responsible for any information, data, or content input, transmitted, or processed by the User/Service Access Administrator through the use of the Resources and are entitled to take any action to protect their rights and interests.</li>\
<li>The entity to which the User belongs remains the sole owner, under EU Regulation No. 679/2016 and Legislative Decree No. 196/2003 as amended by Legislative Decree No. 101/2018, of the data entered and/or processed on the Platform.</li>\
<li>ELIXIR-IT and the service provider reserve the right to activate automatic intrusion detection (IDS) and intrusion prevention (IPS) systems to detect and prevent security rule violations on the Platform.</li>\
<li>ELIXIR-IT and the service provider reserve the right to monitor compliance with the rules of this Policy, including monitoring network traffic and filtering systems on perimeter network devices.</li>\
<li>ELIXIR-IT and the service provider reserve the right to remove or block any content or resource that violates the provisions of this document.</li>\
<li>The User/Administrator is required to inform the Service Manager and include a thank you or citation to ELIXIR-IT and the Service used if any results, publications, posters, or abstracts arise from the use of the service provided by ELIXIR-IT.</li>\
<li>ELIXIR-IT and the service provider, at their discretion and without the possibility of the User contesting this as a breach or violation of any contract, reserve the right to suspend the availability of the Resources without notice in the event that:\
<ol>\
<li>The User/Service Access Administrator violates any of the provisions in the Usage Policy.</li>\
<li>There are reasonable grounds to believe that the Resources are being used by unauthorized third parties.</li>\
<li>Cases of force majeure or circumstances that, at the sole discretion of ELIXIR-IT and the service provider, require emergency actions or security problem resolution, danger to the network and/or people or property; in such cases, the availability of the Resources will be restored when ELIXIR-IT has determined that the causes leading to the suspension have been addressed.</li>\
<li>The User is involved in any legal or extra-judicial civil, criminal, or administrative dispute related to acts or behaviors performed through the Resources.</li>\
<li>Suspension is required by the Judicial Authority.</li>\
</ol></li>\
<li>If users use ELIXIR-IT Resources for storing and processing human genetic data, compliance with the provisions of the GDPR and national legislation, including the measures outlined by the Data Protection Authority in the General Authorizations Nos. 1/2016, 3/2016, 6/2016, 8/2016, and 9/2016 as compatible with the Regulation and Legislative Decree No. 101/2018 is guaranteed.</li>\
<li>The transfer of human genetic data to access the services is carried out through protected communication channels, specifically requiring the use of an encrypted channel based on the SSH protocol for data transmission.\
<ol>\
<li>Users access and can view genetic data only through login with User ID and Password.</li>\
<li>Users accessing the Resources:\
<ol>\
<li>Must ensure that the use of the data does not violate any third-party rights.</li>\
<li>Must ensure the anonymization or pseudonymization of the data in compliance with the GDPR.</li>\
<li>Must ensure the separate processing of genetic and health data from other personal data that could identify the data subject.</li>\
</ol></li>\
<li>The entity/center to which the User belongs must appoint a data processing officer, if this specific service is used.</li>\
</ol></li>\
<li>In the event that research activities conducted using the services provided by the ELIXIR-IT Platform Compute lead to a publication/poster/abstract or any scientific result submitted for publication, the user/Service Access Administrator agrees to cite the services used and ELIXIR-IT within the scientific publication.</li>\
</ol>\
<p>ELIXIR-IT reserves the right to modify this document in the future. The content of such new versions will entirely replace the current version and will have the same legal value. These new versions will be published on the ELIXIR-IT website (<a href="https://elixir-italy.org/">https://elixir-italy.org/</a>) at least one month before they come into effect. Failure to accept the new version will result in the termination of the right to use the Resources.</p>

privacyText=\
<h3>Why this notice</h3>\
<p>In accordance with EU Regulation 2016/679 (hereinafter "Regulation") and Legislative Decree No. 196 of June 30, 2003, as amended by Legislative Decree 101/2018, this notice describes how personal data of users accessing the services of ELIXIR-IT through the entities that provide them are processed. These entities are identified within the Service Delivery Plan (SDP):</p>\
<h3>ELIXIR-IT</h3>\
<p>The Italian node of the European ELIXIR Infrastructure is organized as a Joint Research Unit (JRU) named the Italian Bioinformatics Infrastructure (ELIXIR-IT). It is coordinated by the National Research Council (CNR) and currently includes several partners, including universities, research institutes, and public providers of Cloud and High-Performance Computing (HPC) services. (hereinafter ELIXIR-IT).</p>\
<p>The Italian ELIXIR Node aims to establish an Italian Bioinformatics Infrastructure (IIB) distributed across multiple centers and intends to support Italian researchers in the field of Bioinformatics, promoting the exchange and development of skills, systematizing various internationally recognized and publicly available bioinformatics resources, and contributing to their integration into the European infrastructure.</p>\
<p>ELIXIR-IT also provides both basic and advanced training activities in various application areas of Bioinformatics to support the training of young bioinformaticians, a growing demand at national and international level.</p>\
<p>The activities of ELIXIR-IT are divided into technological areas, called platforms. They coordinate the provision of high-quality computational services for life sciences and lead the integration of national services into the ELIXIR-IT infrastructure. ELIXIR-IT includes six operational platforms (Compute, Data, Interoperability, Tools, Omics, and Training).</p>\
<p>The services provided are open to employees and associates of the entities that are members of the JRU and to third-party personnel participating in activities defined in a contract or agreement with ELIXIR-IT or with any JRU member, as authorized by the JRU manager, upon reading, understanding, and explicitly accepting the terms and conditions specified in this document.</p>\
<h3>Data Controller</h3>\
<p>Name of the service provider entity: Dipartimento Scienze Biomediche del Consiglio Nazionale delle Ricerche (nel seguito DSB-CNR)<br>\
Address of the service provider entity: Piazzale Aldo Moro, 7 - 00185 Roma – Italia<br>\
Email: direttore.dsb@cnr.it</p>\
<h3>Data Protection Officer</h3>\
<p>Data Protection Officer (for the service provider entity): Dr. Ing. Roberto Puccinelli<br>\
Email: rpd@cnr.it or dpo@cnr.it<br>\
PEC: rpd@pec.cnr.it</p>\
<h3>Processing of Personal Data for Service Use</h3>\
<p>ELIXIR-IT provides an infrastructure and a set of services for scientific research purposes or for the purposes outlined in the agreement for the establishment of the JRU or defined by other participants in the JRU.</p>\
<p>The service is available to JRU members and their employees, or those with access through a project, contract, or agreement with the entity providing the service, as outlined in the Service Delivery Plan of ELIXIR-IT, upon reading, understanding, and explicitly accepting the terms and conditions specified in this document.</p>\
<p>The services to which this notice applies are all those described in the technical annex to this contract.</p>\
<p>Processing refers to any operation or set of operations regarding the collection, registration, organization, storage, consultation, processing, modification, selection, extraction, comparison, use, interconnection, blocking, communication, deletion, and distribution of data related to the users of the services.</p>\
<p>CNR-IBIOM collects information to improve or develop services, generate technical insights, and ensure support.</p>\
<p>The data processed for the use of the services are of the types specified below.</p>\
<h3>Types of Data Processed</h3>\
<h4>Data provided by the user</h4>\
<p>These are all personal data provided by the user during navigation on the website, such as when registering, accessing a reserved area, or using a service.</p>\
<p>Processing for these purposes is carried out with the explicit consent provided by the user, and the data is kept only for the duration of the requested activity. Specific notices may be published for the provision of certain activities.</p>\
<p>The optional, explicit, and voluntary sending of emails to the addresses indicated on this site results in the subsequent acquisition of the sender’s address, necessary to respond to requests, as well as any other personal data included in the message.</p>\
<p>Sensitive or judicial data, if provided by the user, will be deleted.</p>\
<h4>Accounting Data</h4>\
<p>To access the ICT services provided by ELIXIR-IT through DSB-CNR, user registration is required through a Life Science AAI authentication service (<a href="https://lifescience-ri.eu/ls-login/policy-on-the-processing-of-personal-data-of-the-ls-aai-service.html">https://lifescience-ri.eu/ls-login/policy-on-the-processing-of-personal-data-of-the-ls-aai-service.html</a>) or an identity provider recognized by CNR, as defined in the agreement/contract.</p>\
<h4>Monitoring Data</h4>\
<p>As part of the service activities, DSB-CNR entity’s personnel responsible for monitoring and managing user support interventions or conducting periodic security scans may process data related to access logs (including SSH access data).</p>\
<h3>Communication and Dissemination</h3>\
<p>The data may be communicated by the Data Controller in the course of their activities and to provide their services, to:</p>\
<ul>\
<li>Public Administrations;</li>\
<li>Service providers, hosting providers, and cloud service providers;</li>\
<li>Judicial Authority.</li>\
</ul>\
<p>The collected data will not be disseminated or communicated to third parties, except as provided by the notice and the law, and in any case, only in the manner allowed by them. The data may be accessed by DSB-CNR entity’s personnel within their respective functions and in compliance with the received instructions, solely for achieving the purposes outlined in this notice.</p>\
<p>Recipients will be appointed, if necessary, as Data Processors by the Data Controller, who may be asked for an updated list of the Data Processors. These Data Processors, under the contract, are required to use the personal data exclusively for the purposes indicated by the Data Controller, not to retain them beyond the specified duration, nor to transfer them to third parties without explicit authorization.</p>\
<h3>Methods of Processing</h3>\
<p>Personal data processing is primarily carried out using electronic procedures and supports, and in a lawful, correct, and appropriate manner, limited to what is necessary to achieve the purposes of the processing, for only the time necessary to fulfill the purposes for which they were collected, and in any case, in compliance with the principles outlined in Article 5 of EU Regulation 2019/679 GDPR.</p>\
<p>Specific security measures are implemented to prevent data loss, unlawful or incorrect use, and unauthorized access.</p>\
<h3>Location of Data Processing</h3>\
<p>Personal data processing related to the ELIXIR-IT services provided by DSB - CNR takes place at the service provider’s facilities and is managed solely by technical staff of the office responsible for processing or by Data Processors appointed by the Data Controller who operate within the European Union. The User’s personal data may be transferred to a country other than the one where the User is located. The User can verify whether any of the transfers described above occur by reviewing the section of this document related to details on the processing of Personal Data or by requesting information from the Data Controller by contacting them through the provided contact details.</p>\
<h3>Duration of Processing</h3>\
<p>DSB-CNR processes the personal data collected for the time necessary to enable the use of the requested service and in any case, no longer than 12 months from the cessation of its use.</p>\
<h3>Rights of the Data Subject</h3>\
<p>Data subjects have the right to request access to personal data, rectification or deletion of data, limitation of processing, or to object to processing as provided in Articles 15 and following of the Regulation. The request must be submitted by contacting the Data Protection Officer at the contact details provided above.</p>\
<p>Data subjects also have the right to lodge a complaint with the Data Protection Authority (<a href="https://garanteprivacy.it">https://garanteprivacy.it</a>) or take appropriate legal action (Articles 77 and 79 of the Regulation).</p>\
<h3>Updates</h3>\
<p>This notice is subject to updates in accordance with national and EU regulations. It is recommended to consult it periodically. In case of failure to accept the changes made to this notice, the user can request the deletion of their personal data from the Data Controller.</p>\
<p>Unless otherwise specified, the privacy policy published on the site continues to apply to the processing of personal data collected until its replacement.</p>
