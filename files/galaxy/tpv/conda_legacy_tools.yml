# Tools that must keep running with Conda, now and after the switch to Singularity + CVMFS (TODO-024).
# Loaded after tools.yml and singularity_tools.yml, so it wins over both.
# '_conda_legacy' rejects the singularity destinations, so these tools stay on condor_tpv (Conda).
# Do not list here a tool that must run in a container (singularity_tools.yml): this file would win
# and send it back to Conda.
#
# Today (Conda default) this changes nothing for the tools listed here, except that their old
# 'require: [conda, singularity]' rules are gone from tools.yml (UG-112: no destination had the conda tag).
# At the switch, tool_defaults.yml will require the 'singularity' tag by default and this file keeps
# the listed tools on Conda. To move a tool to Singularity: test it in the container, then comment
# its entry out.
tools:
  _conda_legacy:
    abstract: true
    scheduling:
      reject:
        - singularity

