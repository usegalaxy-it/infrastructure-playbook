# TEMPORARY: tools that must run in a Singularity container while the default is still Conda.
# Loaded right after tools.yml. Only the scheduling tag lives here: cores, mem, env and container
# params of these tools stay in tools.yml.
#
# Delete this file at the switch to Singularity + CVMFS (TODO-024), when tool_defaults.yml requires
# the 'singularity' tag for every tool: remove it from job_conf.yml and from galaxy_config_files.
# A tool listed here must not be in conda_legacy_tools.yml (that file is loaded later and wins).
# Each entry sets only scheduling (no 'inherits', so it does not replace an 'inherits' set in tools.yml).
