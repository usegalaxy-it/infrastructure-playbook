---
- name: MQ
  hosts: rabbitmq
  become: true
  vars:
    hostname: "{{ groups['rabbitmq'][0] }}"
  vars_files:
    - secret_group_vars/all.yml
    - "{{ rabbit_secrets_file }}"  # rabbitmq + pulsar
  collections:
    - devsec.hardening
  pre_tasks:
    - debug:
        msg: '{{ rabbitmq_users_password }} and {{ redis_requirepass }}'
    # necessary packages for RockyLinux9
    - name: Enable epel-release for python3-virtualenv
      yum:
        name: epel-release
        state: present
    - name: Install Packages for AlmaLinux
      ansible.builtin.dnf:
        name:
          - epel-release
    - name: Install Dependencies
      ansible.builtin.dnf:
        name:
          - python3
          - python3-psycopg2
          - python3-virtualenv
          - selinux-policy-targeted
          - python3-cryptography
          - initscripts-service 
        state: present
        enablerepo: crb
      become: true

    # Selinux
    - name: Configure SELinux
      ansible.posix.seboolean:
        name: "{{ item }}"
        state: true
        persistent: true
      loop:
        - httpd_can_network_connect
    - name: Change the redis_t domain to permissive
      community.general.selinux_permissive:
        name: redis_t
        permissive: true
    - name: Change the chronyd_t domain to permissive
      community.general.selinux_permissive:
        name: chronyd_t
        permissive: true

    # Firewall
    - name: Install firewalld (absent by def in Rocky9)
      package:
        name: firewalld
    - name: Enable firewalld service
      ansible.builtin.service:
        name: firewalld
        enabled: true
        state: started
    - name: Open ports for redis
      ansible.posix.firewalld:
        port: 6379/tcp
        permanent: true
        state: enabled
    - name: Open ports for chronyd
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        state: enabled
      loop:
        - 1123/udp
        - 123/udp
    - name: Open ports for rabbitmq
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
      loop:
        - amqp
        - amqps
        - https
        - http

    # Redis needed by Celery starting from galaxy v.23.0
    - name: Create redis group
      group:
        name: redis
        state: present
    - name: Create redis user
      user:
        name: redis
        group: redis
    - name: Create redis db dir
      ansible.builtin.file:
        path: /var/lib/redis
        owner: redis
        group: redis
        state: directory
        mode: "0755"
    - name: Create redis log dir
      ansible.builtin.file:
        path: /var/log/redis
        owner: redis
        group: redis
        state: directory
        mode: "0755"
    - name: Touches redis
      ansible.builtin.file:
        path: /var/log/redis/redis-server.log
        owner: redis
        group: redis
        state: touch
        mode: "0644"
    #### Luca: users and tasks for certificate in dev
    - name: Create rabbitmq group
      ansible.builtin.group: { name: rabbitmq, gid: 1999 }
    - name: Create rabbitmq user
      ansible.builtin.user: { name: rabbitmq, uid: 1999, group: rabbitmq }
    - name: Create nginx user
      ansible.builtin.user: { name: nginx, system: true, create_home: false }

#    - name: Internal TLS certificate (instead of certbot)
#      ansible.builtin.include_tasks: tasks/internal_tls.yml
  roles:
    ## Starting configuration of the operating system
    - role: usegalaxy_eu.handy.os_setup
      vars:
        enable_hostname: true
        enable_powertools: true       # geerlingguy.repo-epel role doesn't enable PowerTools repository
        enable_remap_user: true       # change existing 999:999 user
        enable_exclude_packages: true
        enable_pam_limits: true       # Prevent out of control processes
        enable_install_software: true # Some extra admin tools (*top, vim, etc)
    - geerlingguy.repo-epel     # Install EPEL repository
    - usegalaxy-eu.autoupdates  # keep all of our packages up to date
    - influxdata.chrony         # Keep our time in sync.
    # Applications
    - geerlingguy.docker
    - galaxyproject.nginx
#    - role: usegalaxy-eu.certbot # run before nginx to aviod fail in the next step # Luca: not needed in dev due to only internal conn
#      vars:
#        certbot_install_method: virtualenv
    - usegalaxy_eu.rabbitmqserver
    - geerlingguy.redis
    #- role: dj-wasabi.telegraf
    #  vars:
    #    telegraf_agent_hostname: "rabbitmq-usegalaxy-it"
    # hardening
    - os_hardening
    - ssh_hardening
