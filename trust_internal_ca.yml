---
# Installa la CA interna tra le CA di sistema, così i client
# (Galaxy, Celery, Telegraf, Pulsar...) si fidano dei certificati che firma.
#
# Prima si assicura che la CA esista (la crea sulla control se manca),
# così può essere la primissima operazione su un ambiente nuovo.
- name: Internal CA | ensure it exists
  ansible.builtin.include_role:
    name: internal_tls
    tasks_from: ca.yml

- name: Internal CA | install in system trust store
  ansible.builtin.copy:
    src: "{{ internal_ca_dir }}/ca.crt"
    dest: /etc/pki/ca-trust/source/anchors/usegalaxy-internal-ca.crt
    owner: root
    group: root
    mode: "0644"
  register: internal_ca_trust

- name: Internal CA | update system trust store
  ansible.builtin.command: update-ca-trust
  when: internal_ca_trust is changed
